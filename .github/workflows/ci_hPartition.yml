name: Build hPartition

on:
  push: 
    branches: ["hPartition"]
    tags: ["hPartition*"]
  pull_request:  
    branches: ["hPartition"]

# If a Second Commit is Pushed After, and Build is Not Complete, Cancel
# Extremely Important with the High Computation Time and Power Required of Arm Linux Builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x86-64:
    name: Linux x86-64 gcc-${{ matrix.gcc-version }} cmake-${{ matrix.cmake-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported gcc and cmake versions
          - gcc-version: 9
            cmake-version: 3.14.7
            upload: false
          # Latest supported gcc and cmake versions
          - gcc-version: 12
            cmake-version: latest
            upload: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Install dependencies
      run: |
        sudo apt-get update -q -y
        sudo apt-get install -q -y gcc-${{ matrix.gcc-version }} g++-${{ matrix.gcc-version}} libeigen3-dev libboost-dev
    
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: ${{ matrix.cmake-version }}

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DIQTREE_FLAGS=static -DCMAKE_C_COMPILER=$(which gcc-${{ matrix.gcc-version }}) -DCMAKE_CXX_COMPILER=$(which g++-${{ matrix.gcc-version }})
        make -j
        file iqtree2 | grep x86-64

    - name: Run hPartition
      run: |
        cd build
        ./iqtree2 -s ../example/example.phy -seed 0 -hPartition -undo

    - name: Run hPartition-PF
      run: |
        cd build
        ./iqtree2 -s ../example/example.phy -seed 0 -hPartition-pf -undo

    - name: Compress Binary
      if: ${{ matrix.upload }}
      shell: bash
      run: |
        cd build
        VERSION=${{ github.ref_name }}
        VERSION=${VERSION#v}
        tar -czvf iqtree-${VERSION}-Linux-intel.tar.gz iqtree2

    - name: Upload Release Archive
      if: ${{ matrix.upload }}
      uses: actions/upload-artifact@v4
      with:
        name: Linux-intel-archive
        path: build/iqtree-*.tar.gz
        if-no-files-found: error

  build-linux-aarch64:
     name: Linux aarch64
     runs-on: ubuntu-22.04-arm
 
     steps:
       - name: Checkout
         uses: actions/checkout@v4
         with:
           submodules: "recursive"
 
       - name: Install dependencies
         run: |
           sudo apt-get update -q -y
           sudo apt-get install -q -y gcc g++ libeigen3-dev libboost-dev
    
       - name: Build
         run: |
           mkdir build
           cd build
           cmake .. -DIQTREE_FLAGS=static
           make -j
           file iqtree2 | grep aarch64

       - name: Run hPartition
         run: |
           cd build
           ./iqtree2 -s ../example/example.phy -seed 0 -hPartition -undo
  
       - name: Run hPartition-PF
         run: |
           cd build
           ./iqtree2 -s ../example/example.phy -seed 0 -hPartition-pf -undo

       - name: Compress Binary
         shell: bash
         run: |
           cd build
           VERSION=${{ github.ref_name }}
           VERSION=${VERSION#v}
           tar -czvf iqtree-${VERSION}-Linux-arm.tar.gz iqtree2

       - name: Upload Release Archive
         uses: actions/upload-artifact@v4
         with:
           name: Linux-arm-archive
           path: build/iqtree-*.tar.gz
           if-no-files-found: error

  build-macos-x86_64:
    name: Mac OS x86-64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
  
      - name: Install dependencies
        run: brew install make eigen boost libomp
  
      - name: Build
        run: |
          set -x
          mkdir build
          cd build
          export LDFLAGS="-L/usr/local/opt/libomp/lib"
          export CPPFLAGS="-I/usr/local/opt/libomp/include"
          export CXXFLAGS="-I/usr/local/opt/libomp/include"
          cmake .. -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEIGEN3_INCLUDE_DIR=$(brew --prefix eigen)/include/eigen3
          make -j
          file iqtree2 | grep x86_64

      - name: Run hPartition
        run: |
          cd build
          ./iqtree2 -s ../example/example.phy -seed 0 -hPartition -undo
  
      - name: Run hPartition-PF
        run: |
          cd build
          ./iqtree2 -s ../example/example.phy -seed 0 -hPartition-pf -undo

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: Mac-intel-raw
          path: build/iqtree2
          if-no-files-found: error
      
  build-macos-arm:
    name: Mac OS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
  
      - name: Install dependencies
        run: brew install make eigen boost libomp

      - name: Build
        run: |
          set -x
          mkdir build
          cd build
          export LDFLAGS="-L/opt/homebrew/opt/libomp/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/libomp/include"
          export CXXFLAGS="-I/opt/homebrew/opt/libomp/include"
          cmake .. -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEIGEN3_INCLUDE_DIR=$(brew --prefix eigen)/include/eigen3
          gmake -j
          file iqtree2 | grep arm64

      - name: Run hPartition
        run: |
          cd build
          ./iqtree2 -s ../example/example.phy -seed 0 -hPartition -undo
  
      - name: Run hPartition-PF
        run: |
          cd build
          ./iqtree2 -s ../example/example.phy -seed 0 -hPartition-pf -undo

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: Mac-arm-raw
          path: build/iqtree2
          if-no-files-found: error
      
  compile-mac-universal:
    name: Mac OS Universal
    runs-on: macos-14
    needs:
      - build-macos-x86_64
      - build-macos-arm
    
    steps:
      - name: Download Intel Binary
        uses: actions/download-artifact@v4
        with:
          name: Mac-intel-raw
          path: mac-intel

      - name: Download ARM Binary
        uses: actions/download-artifact@v4
        with:
          name: Mac-arm-raw
          path: mac-arm

      - name: Combine Architectures
        run: lipo -create -output iqtree2 mac-intel/iqtree2 mac-arm/iqtree2

      - name: Check Architectures
        run: lipo -archs iqtree2

      - name: Compress Binaries
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          zip -j iqtree-${VERSION}-macOS-intel.zip mac-intel/iqtree2
          zip -j iqtree-${VERSION}-macOS-arm.zip mac-arm/iqtree2
          zip -j iqtree-${VERSION}-macOS.zip iqtree2

      - name: Upload Release Archives
        uses: actions/upload-artifact@v4
        with:
          name: Mac-archives
          path: "*.zip"
          if-no-files-found: error

  build-windows-x86-64:
    name: Windows x86-64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install LLVM v14
        shell: cmd
        run: choco install llvm --version=14.0.6 --allow-downgrade
              
      - name: Install Boost
        shell: pwsh
        run: |
          curl -L -o boost.tar.gz https://github.com/MarkusJx/prebuilt-boost/releases/download/1.84.0/boost-1.84.0-windows-2022-mingw-static-x86.tar.gz
          tar -xzf boost.tar.gz
          mv boost C:/local/boost

      - name: Install Eigen3
        shell: cmd
        run: choco install eigen

      - name: Compile
        shell: cmd
        run: |
          if exist build rd /s /q build
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" ^
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ ^
            -DCMAKE_C_FLAGS=--target=x86_64-pc-windows-gnu ^
            -DCMAKE_CXX_FLAGS=--target=x86_64-pc-windows-gnu ^
            -DCMAKE_MAKE_PROGRAM=mingw32-make ^
            -DBoost_INCLUDE_DIR="C:/local/boost/include" ^
            -DBoost_LIBRARY_DIRS="C:/local/boost/lib" ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DIQTREE_FLAGS="static cpp14" ..
          make -j
        env:
          BOOST_ROOT: "C:/local/boost"

      - name: Check File Arch
        shell: bash
        run: |
          cd build
          file iqtree2.exe | grep x86-64

      - name: Run hPartition
        shell: pwsh
        run: |
          cd build
          .\iqtree2.exe -s ../example/example.phy -seed 0 -hPartition -undo

      - name: Run hPartition-PF
        shell: pwsh
        run: |
          cd build
          .\iqtree2.exe -s ../example/example.phy -seed 0 -hPartition-pf -undo

      - name: Compress Binary
        shell: pwsh
        run: |
          cd build
          $Version = "${{ github.ref_name }}"
          if ($Version.StartsWith("v")) { $Version = $Version.Substring(1) }
          Compress-Archive -Path iqtree2.exe -DestinationPath "iqtree-$Version-Windows.zip"

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: Windows-archive
          path: build/iqtree-*-Windows.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: 
      - build-linux-x86-64
      - build-linux-aarch64
      - compile-mac-universal
      - build-windows-x86-64
    if: startsWith(github.ref, 'refs/tags/hPartition')
    
    steps:
      - name: Download all zipped artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-archive*'
          path: release-assets
          merge-multiple: true 

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "hPartition: An Efficient and Robust Alignment Partitioning Framework for Large-Scale DNA and Protein Phylogenomics"    
          body_path: .github/release-notes.md 
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}